spring:
  application:
    name: teamblog-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/blog}
    username: ${DB_USER:blog}
    password: ${DB_PASSWORD:blog_dev_pw}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # 硬要求：实体必须与 Flyway 迁移一致
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  issuer: teamblog
  access-ttl: 30m                 # access token 30 分钟
  refresh-ttl: 7d                 # refresh token 7 天（httpOnly Cookie）
  cookie-secure: false            # 生产必须 true（HTTPS），由环境变量覆盖
  # 不给默认值：缺 JWT_SECRET 时启动直接失败，避免"开发密钥上线"（S-07）
  secret: ${JWT_SECRET:}

auth:
  login:
    max-failures: 5               # 连续失败 5 次后，第 6 次直接 429
    window: 10m                   # 计数窗口；窗口过后自动清零

invite:
  ttl: 7d                         # 邀请链接有效期；过期后兑换返回 410

upload:
  dir: ./uploads
  max-image-size: 5MB
  max-code-size: 256KB

---
# 本地开发：额外加载种子（R__seed_dev.sql），生产不加载
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/seed

jwt:
  # 仅本机开发用。dev profile 显式给一个值，是为了让新同学 clone 下来就能跑；
  # 它绝不用于生产——生产必须通过环境变量注入 JWT_SECRET。
  secret: ${JWT_SECRET:dev-local-only-secret-please-override-with-env-32}
