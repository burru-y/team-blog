spring:
  application:
    name: teamblog-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/blog}
    username: ${DB_USER:blog}
    password: ${DB_PASSWORD:blog_dev_pw}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # 硬要求：实体必须与 Flyway 迁移一致
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
# 本地开发：额外加载种子（R__seed_dev.sql），生产不加载
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/seed
