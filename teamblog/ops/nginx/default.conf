# TeamBlog 反向代理
#
# 三个上游：web（Next.js）、api（Spring Boot）、静态文件（上传目录，直接由 nginx 读）
#
# 关键的一条是 proxy_buffering off：SSE 必须关掉缓冲，否则流式响应会被 nginx
# 攒成一整块再吐出来，表现为"转 30 秒一次性出现全部文字"。
# 这个坑在本地 dev server 上测不出来——本地没有 nginx。

upstream teamblog_api {
    server api:8080;
    keepalive 16;
}

upstream teamblog_web {
    server web:3000;
    keepalive 16;
}

upstream teamblog_ai {
    server ai:8000;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    # 上传文件上限比应用层的 5MB 略大，让应用给出可读的错误而不是被 nginx 先拒
    client_max_body_size 8m;

    # 基础安全头（TLS 在网关层终止时也要有）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 容器健康检查用，不打日志
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # 上传的图片：nginx 直接读共享卷，不经过 Java（省线程、更快）
    location /uploads/ {
        alias /var/www/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        # 只允许图片：万一有人传了别的东西，也不要让浏览器当页面渲染
        types {
            image/png  png;
            image/jpeg jpg jpeg;
            image/gif  gif;
            image/webp webp;
        }
        default_type application/octet-stream;
    }

    # 内部摘要端点：只允许 Spring 在容器网络内直连，外网一律 403（7.3 的验收项）
    location = /ai/v1/summarize {
        return 403;
    }

    # AI 的 SSE 端点：Nginx 直连 ai:8000，不经 Spring
    location /ai/ {
        proxy_pass http://teamblog_ai/;   # 结尾的 / 会去掉 /ai 前缀
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;          # ← 不关这一行，流式就变成"一次性"
        proxy_cache off;
        proxy_read_timeout 300s;      # 模型可能要想很久，默认 60s 会掐断
        chunked_transfer_encoding on;
    }

    location /api/ {
        proxy_pass http://teamblog_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Next.js 的构建产物文件名带内容哈希，内容一变文件名就变，
    # 所以可以放心让浏览器缓存一年。3M 带宽的机器上，这能省掉大部分重复请求。
    location /_next/static/ {
        proxy_pass http://teamblog_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://teamblog_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # gzip：文本类才压缩，图片已经压过了
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
