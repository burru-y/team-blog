# TeamBlog 反向代理（HTTPS 版本）
#
# 与 default.conf 的差别只有两处：
#   1. 80 端口只做 301 跳转，不再提供服务
#   2. 443 上启用 TLS，其余 location 完全一致
#
# 证书放在 ops/nginx/certs/（已 gitignore）。本地用自签证书，生产换成 Let's Encrypt
# 或云厂商证书，路径不变。

upstream teamblog_api {
    server api:8080;
    keepalive 16;
}

upstream teamblog_web {
    server web:3000;
    keepalive 16;
}

upstream teamblog_ai {
    server ai:8000;
    keepalive 8;
}

# HTTP：只做跳转。保留 /healthz 给容器健康检查用（它走的是 http）。
server {
    listen 80;
    server_name _;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host:$server_port_https$request_uri;
    }

    # 映射到宿主机时 80 与 443 是不同端口，nginx 自己不知道宿主机端口，
    # 所以重定向目标用变量注入（见 compose.tls.yaml 的 environment）。
    set $server_port_https 8443;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 自签证书的本地环境没有 OCSP，关掉避免每握手多一次外部请求
    ssl_stapling off;

    client_max_body_size 8m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # 上了 HTTPS 才能开 HSTS。注意：一旦开启，浏览器会强制该域名只走 HTTPS，
    # 本地自签证书调试时可以先注释掉。
    # add_header Strict-Transport-Security "max-age=15552000" always;

    location /uploads/ {
        alias /var/www/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        types {
            image/png  png;
            image/jpeg jpg jpeg;
            image/gif  gif;
            image/webp webp;
        }
        default_type application/octet-stream;
    }

    # 内部摘要端点：外网一律 403（Spring 走容器网络直连 ai:8000）
    location = /ai/v1/summarize {
        return 403;
    }

    location /ai/ {
        proxy_pass http://teamblog_ai/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;          # SSE 必须关
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    location /api/ {
        proxy_pass http://teamblog_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://teamblog_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
}
