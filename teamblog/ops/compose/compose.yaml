# TeamBlog 全栈：db + api + web + nginx
#
# 一条命令：  docker compose --env-file ../.env up -d --build
# 首次启动会自动跑 Flyway 迁移（应用启动时执行），不需要手工 SQL。

name: teamblog

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blog}
      POSTGRES_USER: ${POSTGRES_USER:-blog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须设置}
      # 数据库时区跟着业务时区走，否则 date 类型的默认值会差一天
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blog} -d ${POSTGRES_DB:-blog}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # 不对外暴露端口：只有同一网络里的 api 能连，宿主机通过 compose exec 进去
    expose:
      - "5432"

  api:
    build:
      context: ../../api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-blog}
      DB_USER: ${POSTGRES_USER:-blog}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必须设置}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 必须设置（至少 32 字节）}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      UPLOAD_DIR: /app/uploads
      TZ: Asia/Shanghai
    volumes:
      # 上传目录与 nginx 共享：api 写，nginx 直接读，静态文件不经过 Java
      - uploads:/app/uploads
    expose:
      - "8080"

  web:
    build:
      context: ../../web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # 服务端组件直连 api；浏览器侧的请求由 Nginx 反代 /api
      API_ORIGIN: http://api:8080
      TZ: Asia/Shanghai
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "${HTTP_PORT:-8088}:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/var/www/uploads:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  uploads:
