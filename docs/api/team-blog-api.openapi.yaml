openapi: 3.1.0
info:
  title: TeamBlog API
  version: 0.1.0
  description: |
    当前已实现的端点：健康检查、登录、刷新、登出、当前用户。

    这份文件可以直接导入 Apifox（导入 → OpenAPI/Swagger → 选择本文件），
    也可以作为批次 2.1「契约先行」的起点——之后由 Spring 生成全量 OpenAPI，
    与前端类型生成对齐。

    认证说明：
    - `accessToken` 放 `Authorization: Bearer <token>`，有效期 30 分钟；
    - `refreshToken` 只存在于 httpOnly Cookie（名为 `rt`，Path=/api/v1/auth，7 天），
      前端 **读不到也不需要读**，登录/刷新后由浏览器自动携带；
    - 刷新会轮换 Cookie；拿已经轮换掉的旧 Cookie 再刷新，会触发全量撤销（401 SESSION_REVOKED）。
servers:
  - url: http://127.0.0.1:8080
    description: 本地开发

tags:
  - name: auth
    description: 认证（无需登录态）
  - name: user
    description: 用户
  - name: project
    description: 成果（项目 / 证书 / 奖项）
  - name: learning
    description: 学习内容
  - name: upload
    description: 文件上传
  - name: health
    description: 健康检查

paths:
  /api/v1/health:
    get:
      tags: [health]
      operationId: health
      summary: 健康检查（含数据库与迁移版本）
      security: []
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiHealth'
        '503':
          description: 数据库不可用

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: 用户名密码登录
      description: |
        成功时：响应体返回 accessToken，同时 `Set-Cookie: rt=...; HttpOnly; SameSite=Lax`。

        失败文案对"用户不存在"和"密码错误"完全一致（防枚举）。

        同一账号或同一 IP 连续失败 5 次后，第 6 次直接返回 429（带 `Retry-After`），
        文案仍是"用户名或密码错误"——不额外透露"这个账号被锁了"。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: admin1
              password: ChangeMe123!
      responses:
        '200':
          description: 登录成功
          headers:
            Set-Cookie:
              description: 写入 refresh token（HttpOnly，7 天）
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiToken'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          description: 触发登录限流（同一账号或 IP 连续失败 5 次）
          headers:
            Retry-After:
              description: 多少秒后可以再试
              schema:
                type: integer
                example: 573
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                ok: false
                data: null
                error:
                  code: RATE_LIMITED
                  message: 用户名或密码错误

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: 用 refresh Cookie 换一对新凭据（轮换）
      description: |
        每次刷新都会作废旧 Cookie 并下发新的。

        如果提交的是**已经被轮换掉**的旧 Cookie，说明发生了重放：服务端会撤销该用户
        全部会话（包括仍有效的 access token），返回 401 `SESSION_REVOKED`。
      security:
        - refreshCookie: []
      responses:
        '200':
          description: 刷新成功（下发新的 refresh Cookie）
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiToken'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 登出（作废当前 refresh token 并清 Cookie）
      security:
        - refreshCookie: []
      responses:
        '200':
          description: 已登出（Set-Cookie 的 Max-Age=0）
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiVoid'

  /api/v1/me:
    get:
      tags: [user]
      operationId: getCurrentUser
      summary: 当前登录用户
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/admin/invites:
    post:
      tags: [invite]
      operationId: createInvite
      summary: 管理员生成一次性邀请（仅 ADMIN）
      description: |
        返回的 `token` 是**唯一一次**能看到明文的地方，库里只存哈希。

        邀请默认 7 天有效（`invite.ttl`）。角色必须显式传 ADMIN 或 MEMBER——
        不给默认值，避免"本来只想拉成员，手滑拉成管理员"。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteRequest'
            example:
              email: newbie@example.com
              role: MEMBER
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiInviteCreated'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: 不是管理员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/invites/{token}:
    get:
      tags: [invite]
      operationId: getInviteInfo
      summary: 查看邀请信息（注册页用，公开）
      description: 让注册页预先展示"这个链接是给谁的、什么时候过期"，避免用户填完密码才被告知失效。
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 邀请可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiInviteInfo'
        '410':
          $ref: '#/components/responses/InviteInvalid'

  /api/v1/invites/{token}/accept:
    post:
      tags: [invite]
      operationId: acceptInvite
      summary: 凭邀请注册（公开）
      description: |
        成功后返回 201 与新建账号的公开资料（**不含密码哈希**），用户随后走登录接口。

        同一邀请只能用一次：第二次兑换返回 410 `INVITE_INVALID`（数据库条件更新保证，
        并发下也只有一个请求能成功）。
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: newbie01
              password: S3cret!pass
              email: newbie@example.com
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUser'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          description: 用户名或邮箱已被占用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '410':
          $ref: '#/components/responses/InviteInvalid'

  /api/v1/users:
    get:
      tags: [user]
      operationId: listMembers
      summary: 成员列表（公开，游标分页）
      description: |
        按创建时间倒序，游标分页（A-08）：

        - 第一页不带 `cursor`；之后每次把上一页返回的 `nextCursor` 原样带回
        - `nextCursor` 为 `null` 表示没有下一页
        - `limit` 默认 20，上限 100（超出静默收敛，不报错）

        已软删的账号不会出现在列表里（D-13）。
      security: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: 上一页返回的 nextCursor；不透明字符串，客户端不要解析
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUserPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'

  /api/v1/users/{username}:
    get:
      tags: [user]
      operationId: getUserProfile
      summary: 公开资料（公开；邮箱按 email_public 决定是否返回）
      description: |
        访客也能访问（个人页 `/u/{username}` 的数据源）。

        邮箱只在 `emailPublic = true` 时返回，否则整个字段被省略（S-10）。
        用户名大小写不敏感，软删账号按不存在处理（404）。
      security: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
          example: member1
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUser'
        '404':
          description: 用户不存在或已删除
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                ok: false
                data: null
                error:
                  code: NOT_FOUND
                  message: 用户不存在

  /api/v1/projects:
    get:
      tags: [project]
      operationId: listProjects
      summary: 成果流（公开，游标分页）
      description: 只返回上架（ACTIVE）的成果；已下架的按不存在处理。
      security: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProjectPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'

    post:
      tags: [project]
      operationId: createProject
      summary: 发布成果（需登录）
      description: |
        必填字段按类型不同（与数据库 CHECK 同义，但给出可读提示）：

        - `PROJECT`：`githubUrl` 与 `contentMd` 必填
        - `CERTIFICATE` / `AWARD`：`imageUrl` 或 `githubUrl` 至少一个

        不满足时返回 422 `RULE_VIOLATED`。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProject'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          description: 违反类型必填规则
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/projects/{id}:
    get:
      tags: [project]
      operationId: getProject
      summary: 成果详情（公开）
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProject'
        '404':
          description: 不存在或已下架
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    put:
      tags: [project]
      operationId: updateProject
      summary: 编辑成果（作者本人或管理员）
      description: 类型不可修改；不是作者也不是管理员时返回 403。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProject'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: 不是作者也不是管理员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 不存在或已下架
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    delete:
      tags: [project]
      operationId: removeProject
      summary: 下架成果（作者本人或管理员）
      description: 软下架：数据保留，状态置为 REMOVED，前台按不存在处理。
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 已下架
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiVoid'
        '403':
          description: 不是作者也不是管理员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 不存在或已下架
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/learning-logs:
    get:
      tags: [learning]
      operationId: listLearningLogs
      summary: 某人的学习内容（公开）
      security: []
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiLearningLogList'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    post:
      tags: [learning]
      operationId: createLearningLog
      summary: 发布学习内容（需登录）
      description: |
        每篇 +10 分，**每天最多计 3 篇**；第 4 篇起照常入库但不加分（防刷分）。

        响应里的 `counted / points / remainingToday` 就是给前端提示用的：
        没加分时应当告诉用户"今日计分额度已用完，内容已保存"。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearningLogCreateRequest'
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiLearningLogCreated'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/learning-logs/{id}:
    get:
      tags: [learning]
      operationId: getLearningLog
      summary: 学习内容详情（公开）
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiLearningLog'
        '404':
          description: 不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    put:
      tags: [learning]
      operationId: updateLearningLog
      summary: 编辑学习内容（作者本人或管理员）
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearningLogUpdateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiLearningLog'
        '403':
          description: 不是作者也不是管理员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/uploads/images:
    post:
      tags: [upload]
      operationId: uploadImage
      summary: 上传图片（需登录）
      description: |
        按**文件头**（magic bytes）判断类型，不信扩展名也不信 Content-Type（S-05）。

        - 允许：PNG / JPEG / GIF / WebP
        - **禁止 SVG**：SVG 是 XML，可内嵌 script，是存储型 XSS 的常见载体
        - 落盘用服务端生成的 UUID 文件名，不使用客户端文件名（防路径穿越与覆盖）
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 上传成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiUploadedImage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/uploads/code:
    post:
      tags: [upload]
      operationId: uploadCode
      summary: 代码文件转 Markdown 代码块（需登录）
      description: |
        按扩展名识别语言（java / py / js / ts / sql / json / yml / sh / go / rs / ...），
        返回拼好的 Markdown，不落盘。正文里已有 ``` 时自动改用更长的围栏。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 转换成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCodeBlock'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 登录或刷新得到的 accessToken
    refreshCookie:
      type: apiKey
      in: cookie
      name: rt
      description: 登录后由服务端下发，浏览器自动携带

  responses:
    Unauthenticated:
      description: 未登录 / token 无效 / 会话已失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            unauthenticated:
              value:
                ok: false
                data: null
                error:
                  code: UNAUTHENTICATED
                  message: 未登录或 token 无效
            sessionRevoked:
              value:
                ok: false
                data: null
                error:
                  code: SESSION_REVOKED
                  message: 会话已失效，请重新登录
    ValidationFailed:
      description: 参数格式错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

    InviteInvalid:
      description: 邀请无效 / 已被使用 / 已过期（410 Gone）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            used:
              value:
                ok: false
                data: null
                error:
                  code: INVITE_INVALID
                  message: 邀请已被使用
            expired:
              value:
                ok: false
                data: null
                error:
                  code: INVITE_INVALID
                  message: 邀请已过期

  schemas:
    ApiError:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          const: false
        data:
          type: 'null'
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - UNAUTHENTICATED
                - SESSION_REVOKED
                - FORBIDDEN
                - NOT_FOUND
                - INVITE_INVALID
                - VALIDATION_FAILED
                - RULE_VIOLATED
                - CONFLICT
                - RATE_LIMITED
                - UPSTREAM_FAILED
                - INTERNAL
            message:
              type: string

    ApiToken:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/TokenResponse'
        error:
          type: 'null'

    ApiUser:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/UserResponse'
        error:
          type: 'null'

    ApiUserPage:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          const: true
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/UserCardResponse'
            nextCursor:
              type: [string, 'null']
              description: null 表示没有下一页

    UserCardResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        role:
          type: string
          enum: [ADMIN, MEMBER]
        avatarUrl:
          type: [string, 'null']
        bio:
          type: [string, 'null']
        totalPoints:
          type: integer

    ProjectCreateRequest:
      type: object
      required: [type, title, description]
      properties:
        type:
          type: string
