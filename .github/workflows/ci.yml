name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一个分支连续 push 时取消上一次还在跑的流水线，省额度也省等待
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai

jobs:
  api:
    name: API · 编译与测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teamblog/api

    services:
      # 用 service 容器而不是 Testcontainers：Runner 里跑 Testcontainers 需要 Docker-in-Docker，
      # 而本项目在本地也是直接连 PostgreSQL（见 application-test.yml 的说明）
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: blog
          POSTGRES_PASSWORD: blog_dev_pw
          POSTGRES_DB: blog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blog -d blog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: teamblog/api/pom.xml

      # 与本地 ops/init/02-test-db.sql 对齐：测试库必须是东八区，
      # 否则"今天"这类业务日期在 UTC 下会差一天
      - name: 对齐数据库时区
        run: |
          PGPASSWORD=blog_dev_pw psql -h localhost -U blog -d blog_test \
            -c "ALTER DATABASE blog_test SET timezone TO 'Asia/Shanghai';"

      - name: 运行测试
        # mvnw 在仓库里的模式是 100644（Windows 提交的），Linux 上要显式加执行位
        run: |
          chmod +x ./mvnw
          ./mvnw -B --no-transfer-progress verify

  web:
    name: Web · 类型与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teamblog/web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: teamblog/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  contract:
    name: 契约 · 类型漂移检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: teamblog/web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: teamblog/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # 改了 OpenAPI 却没重新生成前端类型 → 这里会红（C-02）
      - name: 重新生成前端类型
        run: pnpm exec openapi-typescript ../../docs/api/team-blog-api.openapi.yaml -o src/lib/api-schema.d.ts

      - name: 检查是否有未提交的差异
        run: git -C ../.. diff --exit-code -- teamblog/web/src/lib/api-schema.d.ts
